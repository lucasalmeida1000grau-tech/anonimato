<!doctype html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>Automação ESP32</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .box {
      border: 1px solid #ccc;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    button {
      padding: 12px 18px;
      cursor: pointer;
    }

    input {
      padding: 10px;
      width: 100%;
      box-sizing: border-box;
      margin: 8px 0 15px;
    }

  </style>

</head>

<body>

  <h1>Teste da automação ESP32</h1>

  <div class="box">

    <p>
      Esta é uma página local de teste.
    </p>

    <button
      id="start"
      onclick="showForm()"
    >
      Começar
    </button>

  </div>


  <div
    class="box"
    id="form"
    hidden
  >

    <label for="nome">
      Nome
    </label>

    <input
      id="nome"
      placeholder="Digite um nome"
    >

    <button onclick="showCode()">
      Continuar
    </button>

  </div>


  <div
    class="box"
    id="codeBox"
    hidden
  >

    <p>
      Seu código de teste é:
    </p>

    <strong id="resultado">
      482731
    </strong>

    <br><br>

    <label for="codigo">
      Código
    </label>

    <input
      id="codigo"
      placeholder="Digite o código"
    >

    <button onclick="finish()">
      Finalizar
    </button>

  </div>


  <div
    class="box"
    id="done"
    hidden
  >

    <strong>
      Automação finalizada com sucesso.
    </strong>

  </div>


<script>

function showForm() {

  document
    .getElementById("form")
    .hidden = false;

}


function showCode() {

  document
    .getElementById("codeBox")
    .hidden = false;

}


function finish() {

  document
    .getElementById("done")
    .hidden = false;

}

</script>

</body>

</html>
